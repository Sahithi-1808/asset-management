services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_management
      POSTGRES_PASSWORD: asset_management
    ports:
      - "5434:5432"
    volumes:
      - asset-management-postgres-data:/var/lib/postgresql/data

volumes:
  asset-management-postgres-data:
